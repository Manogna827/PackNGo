<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Create a trip — PackNGo</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/css/style.css?v=20261014"></head>
<body class="app-page"><div id="toast-region" class="toast-region" aria-live="polite"></div><div id="page-notice" class="page-notice" role="alert" hidden></div>
<header class="app-header"><a class="brand" href="/"><span class="brand-mark">P</span>Pack<span>N</span>Go</a><nav><a href="/dashboard.html">← My trips</a><button class="button button-quiet button-small" data-logout>Log out</button></nav></header>
<main class="form-page"><a class="back-link" href="/dashboard.html">← Your trips</a><p class="eyebrow">A LITTLE SPACE FOR THE WHOLE CREW</p><h1>Start your next<br><em>adventure.</em></h1><p class="muted form-intro">Add the basics. You’ll land straight in your trip workspace and can invite everyone from there.</p>
<form id="create-trip-form" class="panel form-panel" novalidate><label for="trip-name">Trip name</label><input id="trip-name" name="name" maxlength="100" placeholder="e.g. A long weekend away" required><label for="destination">Where are you going?</label><input id="destination" name="destination" maxlength="100" placeholder="City, region, or country" required><div class="form-row"><div><label for="start">Start date</label><input id="start" name="start" type="date" required></div><div><label for="end">End date</label><input id="end" name="end" type="date" required></div></div><button class="button button-dark button-full" type="submit">Create trip &amp; open workspace <span aria-hidden="true">↗</span></button></form></main>
<script type="module" src="/js/auth.js"></script><script type="module" src="/js/trip-forms.js"></script></body></html>
